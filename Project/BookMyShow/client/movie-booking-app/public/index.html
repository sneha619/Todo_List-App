<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Booking App</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Welcome to the Movie Booking App</h1>
    </header>
    <main>
        <section id="movie-selection">
            <h2>Select a Movie</h2>
            <div id="movies-list"></div>
        </section>
        <section id="theater-selection" style="display:none;">
            <h2>Select a Theater</h2>
            <div id="theaters-list"></div>
        </section>
        <section id="seat-selection" style="display:none;">
            <h2>Select Seats</h2>
            <div id="seats-arrangement"></div>
        </section>
        <section id="payment-section" style="display:none;">
            <h2>Payment</h2>
            <form id="payment-form">
                <button type="submit">Pay Now</button>
            </form>
        </section>
    </main>
    <script src="js/scripts.js"></script>
</body>
</html>
